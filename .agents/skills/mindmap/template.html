<script type="text/markdown" id="map-source" data-source="sample" data-name="sample.md">
# How to write a mind map
Each **heading** in the Markdown file becomes a node. Everything under a heading is that node's note.

## Headings make nodes
The number of `#` signs sets the depth: `#` is the centre, `##` a main branch, `###` a sub-topic, and so on.

### Sub-topic (###)
A child of the branch above it.

#### Detail (####)
Go as deep as you need.

##### Fine detail (#####)
There is no depth limit.

## Lists
### Unordered list
Use `-` when order does not matter:
- File manipulation
- Status information
- Programming-language support

### Ordered list
Use `1.` when the sequence matters:
1. The program puts the system-call number in a register
2. The system-call interface indexes a table
3. The kernel routine runs and returns a status

## Math
### Inline math
Write math between single dollars: the time slice $q$, or the average waiting time $\bar W = \frac{1}{n}\sum_i W_i$.

### Display math
Use double dollars for an equation on its own line:
$$T_{turnaround} = T_{finish} - T_{arrival}$$

## Code
Put code in a fenced block with the language name after the opening fence. End with a **Result:** line when the output matters.

### C example
```c
#include <stdio.h>

int main(void) {
    printf("%d\n", 6 * 7);
    return 0;
}
```
**Result:** prints `42`

### Python example
```python
def square(x):
    return x * x

print(square(5))
```
**Result:** `25`

### Scheme example
```scheme
(define (fact n)
  (if (= n 0) 1 (* n (fact (- n 1)))))
(fact 5)
```
**Result:** `120`

### Haskell example
```haskell
sumList :: [Int] -> Int
sumList = foldr (+) 0

main = print (sumList [1, 2, 3])
```
**Result:** `6`

<script>
const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

// ---------- Markdown map -> tree ----------

function parseMap(text, fileName) {
  const lines = String(text).replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
  const heads = [];
  let cur = null, fence = null;
  for (const line of lines) {
    const f = line.match(/^\s*(```|~~~)/);
    if (f) fence = !fence ? f[1] : (f[1] === fence ? null : fence);
    const h = !fence && !f && line.match(/^(#+)\s+(.*?)(?:\s+#+)?\s*$/);
    if (h) heads.push(cur = { level: h[1].length, title: h[2], body: [] });
    else if (cur) cur.body.push(line);
  }
  if (!heads.length) return null;

  const nodes = heads.map((h, i) => ({
    id: 'n' + i, title: h.title, body: h.body.join('\n'), level: h.level,
    depth: 0, color: '', parentId: null, children: []
  }));
  const stack = [], tops = [];
  for (const n of nodes) {
    while (stack.length && stack.at(-1).level >= n.level) stack.pop();
    const parent = stack.at(-1);
    if (parent) { n.parentId = parent.id; parent.children.push(n); } else tops.push(n);
    stack.push(n);
  }

  let root = tops[0];
  if (tops.length !== 1 || root.level !== 1) {
    const title = String(fileName || '').replace(/\.[^.]*$/, '') || 'Mind Map';
    root = { id: 'root', title, body: '', level: 0, depth: 0, color: '', parentId: null, children: tops };
    tops.forEach(t => { t.parentId = 'root'; });
  }
  (function walk(n, depth, color) {
    n.depth = depth;
    n.color = color;
    n.children.forEach((c, i) => walk(c, depth + 1, depth === 0 ? `branch-${i % 5 + 1}` : color));
  })(root, 0, 'root');
  return root;
}

function flatten(root) {
  return [root, ...root.children.flatMap(flatten)];
}

function readEmbeddedMap() {
  const el = document.getElementById('map-source');
  return {
    text: el.textContent.replace(/<\\(\\*)(\/script|!--)/gi, '<$1$2'),   // undo exportHTML's escaping
    name: el.dataset.name || 'map.md',
    exported: el.dataset.source === 'export'
  };
}

// ---------- Markdown, math and code rendering ----------

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c]);
}

// Group 1 passes code (and escaped \$) through untouched; the rest is math.
// Inline $…$ follows Pandoc's rule so prose like "$5 and $10" stays text.
const MATH_RE = /(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`|\\\$)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$`])([^$`\n]*?[^\s`])\$(?!\d)/g;

function protectMath(md) {
  const math = [];
  const text = md.replace(MATH_RE, (m, code, d1, d2, i1, i2) => {
    if (code) return m;
    math.push({ tex: d1 ?? d2 ?? i1 ?? i2, display: d1 != null || d2 != null });
    return `MATHTOKEN${math.length - 1}X`;
  });
  return { text, restore: html => html.replace(/MATHTOKEN(\d+)X/g, (_, i) => renderTex(math[i])) };
}

function renderTex({ tex, display }) {
  if (!window.katex) return esc(display ? `$$${tex}$$` : `$${tex}$`);
  return katex.renderToString(tex, { displayMode: display, throwOnError: false });
}

if (window.marked) {
  marked.use({
    renderer: {
      html: ({ text }) => esc(text),   // raw HTML in a map is shown, never run
      code({ text, lang }) {
        const l = String(lang || '').trim().split(/\s+/)[0].toLowerCase() || 'text';
        const body = window.hljs && hljs.getLanguage(l) ? hljs.highlight(text, { language: l }).value : esc(text);
        return `<div class="code-card"><div class="code-top"><span class="dot"></span><span class="dot"></span>` +
          `<span class="dot"></span><span class="code-lang">${esc(l)}</span></div>` +
          `<pre><code class="hljs language-${esc(l)}">${body}</code></pre></div>`;
      }
    }
  });
}

function renderMarkdown(md) {
  const src = String(md ?? '').trim();
  if (!src) return '';
  if (!window.marked) return '<p>' + esc(src).replace(/\n/g, '<br>') + '</p>';
  const { text, restore } = protectMath(src);
  return restore(marked.parse(text));
}

function renderInline(md) {
  if (!window.marked) return esc(md);
  const { text, restore } = protectMath(String(md ?? ''));
  return restore(marked.parseInline(text));
}

function plainTitle(md) {
  const s = String(md ?? '').replace(/\\[()[\]]/g, '').replace(/\$/g, '');
  if (!window.marked) return s.replace(/[`*]/g, '').trim();
  const t = document.createElement('template');
  t.innerHTML = marked.parseInline(s);
  return t.content.textContent.trim();
}

// ---------- Zig-zag layout ----------
// Siblings alternate between a high row (0) and a low row (1). Every (depth, row) pair is a
// horizontal band; bands never overlap vertically, so packing is 1-D per band. Lanes keep room
// for the vertical part of each connector: a low-row node's incoming line crosses its depth's
// high band, and a high-row parent's outgoing line crosses its depth's low band.

const H_GAP = 28, LANE = 16, ROW_GAP = 22, LEVEL_GAP = 64, MARGIN = 40;

function layoutTree(root, kids, size) {
  const info = new Map();

  function pack(node, depth, row) {
    const { w, h } = size(node);
    const me = { w, h, depth, row, rel: 0, children: [] };
    info.set(node.id, me);
    const merged = new Map();   // band -> rightmost edge among children placed so far
    const placed = [];
    kids(node).forEach((child, i) => {
      const contour = pack(child, depth + 1, i % 2);
      let off = placed.length ? placed.at(-1).off : 0;
      if (placed.length) {
        for (const [band, [lo]] of contour) {
          if (merged.has(band)) off = Math.max(off, merged.get(band) + H_GAP - lo);
        }
      }
      for (const [band, [, hi]] of contour) merged.set(band, Math.max(merged.get(band) ?? -Infinity, hi + off));
      placed.push({ child, off, contour });
    });

    const centre = placed.length ? (placed[0].off + placed.at(-1).off) / 2 : 0;
    const contour = new Map();
    const add = (band, lo, hi) => {
      const c = contour.get(band);
      contour.set(band, c ? [Math.min(c[0], lo), Math.max(c[1], hi)] : [lo, hi]);
    };
    add(`${depth}:${row}`, -w / 2, w / 2);
    if (row === 1) add(`${depth}:0`, -LANE / 2, LANE / 2);
    if (row === 0 && placed.length) add(`${depth}:1`, -LANE / 2, LANE / 2);
    for (const p of placed) {
      info.get(p.child.id).rel = p.off - centre;
      me.children.push(p.child.id);
      for (const [band, [lo, hi]] of p.contour) add(band, lo + p.off - centre, hi + p.off - centre);
    }
    return contour;
  }
  pack(root, 0, 0);

  // absolute x (centres), then the vertical bands
  const absX = new Map();
  (function place(id, x) {
    absX.set(id, x);
    info.get(id).children.forEach(c => place(c, x + info.get(c).rel));
  })(root.id, 0);

  const bands = [];
  for (const m of info.values()) {
    const b = bands[m.depth] ??= { hh: 0, hl: 0 };
    if (m.row) b.hl = Math.max(b.hl, m.h); else b.hh = Math.max(b.hh, m.h);
  }
  let y = MARGIN;
  for (const b of bands) {
    b.top = y;
    b.lowTop = y + b.hh + ROW_GAP;
    b.bottom = b.hl ? b.lowTop + b.hl : y + b.hh;
    y = b.bottom + LEVEL_GAP;
  }

  let minL = Infinity, maxR = -Infinity;
  for (const [id, m] of info) {
    minL = Math.min(minL, absX.get(id) - m.w / 2);
    maxR = Math.max(maxR, absX.get(id) + m.w / 2);
  }
  const pos = new Map();
  for (const [id, m] of info) {
    const b = bands[m.depth];
    pos.set(id, { x: absX.get(id) - minL + MARGIN, y: m.row ? b.lowTop : b.top, row: m.row });
  }
  return {
    pos,
    levels: bands.map(b => ({ top: b.top, bottom: b.bottom })),
    width: maxR - minL + 2 * MARGIN,
    height: bands.at(-1).bottom + MARGIN
  };
}

// ---------- Map state, rendering and view ----------

const MIN_SCALE = 0.25, MAX_SCALE = 2.5;
const $ = id => document.getElementById(id);
const wrapper = $('mapWrapper'), stage = $('mapStage'), mindMap = $('mindMap'), svg = $('connections');

let mapRoot = null, nodesById = new Map(), collapsed = new Set(), maxDepth = Infinity, selectedId = null;
let view = { x: 0, y: 0, scale: 1 };
let lastLayout = null, layoutQueued = false, resizeObserver = null;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable: nothing to remember */ } }
};

const visibleKids = n => (collapsed.has(n.id) || n.depth >= maxDepth) ? [] : n.children;

function setMap(root) {
  mapRoot = root;
  nodesById = new Map(flatten(root).map(n => [n.id, n]));
  for (const n of nodesById.values()) {
    n.titleHtml = renderInline(n.title);
    n.bodyHtml = renderMarkdown(n.body);
  }
  collapsed = new Set();
  selectedId = null;
  document.title = plainTitle(root.title) || 'Mind Map';
  renderMap();
  resetView();
}

function buildNode(n) {
  const el = document.createElement('article');
  el.className = `node ${n.color}` + (/^\s*(```|~~~)/m.test(n.body) ? ' code-node' : '');
  el.id = 'node-' + n.id;
  el.dataset.id = n.id;
  const shut = collapsed.has(n.id);
  const toggle = n.children.length && n.depth < maxDepth
    ? `<button class="toggle" type="button" aria-label="${shut ? 'Expand' : 'Collapse'} branch">${shut ? '+' : '−'}</button>` : '';
  el.innerHTML = `<div class="node-header">${toggle}<div class="title">${n.titleHtml}</div></div>` +
    (n.bodyHtml ? `<div class="note">${n.bodyHtml}</div>` : '');
  return el;
}

// anchorId: the node that must not move on screen (the tapped one); defaults to the selection, then the root
function renderMap(anchorId) {
  const shown = new Set();
  (function walk(n) { shown.add(n.id); visibleKids(n).forEach(walk); })(mapRoot);
  let anchor = nodesById.get(anchorId ?? selectedId) || mapRoot;
  while (!shown.has(anchor.id)) anchor = nodesById.get(anchor.parentId);
  const oldEl = $('node-' + anchor.id), before = oldEl && oldEl.getBoundingClientRect();

  mindMap.querySelectorAll('.node').forEach(e => e.remove());
  (function add(n) { mindMap.appendChild(buildNode(n)); visibleKids(n).forEach(add); })(mapRoot);
  fitMath();
  layoutNow();
  if (before) {
    const after = $('node-' + anchor.id).getBoundingClientRect();
    view.x += before.left - after.left;
    view.y += before.top - after.top;
    applyView();
  }
  if (resizeObserver) resizeObserver.disconnect();
  resizeObserver = new ResizeObserver(scheduleLayout);
  mindMap.querySelectorAll('.node').forEach(e => resizeObserver.observe(e));
  // a selection hidden by folding or the depth limit moves up to its nearest visible ancestor
  let n = nodesById.get(selectedId);
  while (n && !$('node-' + n.id)) n = nodesById.get(n.parentId);
  if (n) selectNode(n.id); else { selectedId = null; renderPathBar(); }
}

// ---------- Selection and path bar ----------

function selectNode(id) {
  selectedId = id;
  mindMap.querySelectorAll('.node.selected').forEach(e => e.classList.remove('selected'));
  const el = $('node-' + id);
  if (el) el.classList.add('selected');
  renderPathBar();
}

function renderPathBar() {
  const path = [];
  for (let n = nodesById.get(selectedId) || mapRoot; n; n = nodesById.get(n.parentId)) path.unshift(n);
  const bar = $('pathBar');
  bar.innerHTML = path.map((n, i) => (i ? '<span class="sep">›</span>' : '') +
    `<button type="button" class="crumb${n.id === selectedId ? ' on' : ''}" data-id="${esc(n.id)}">${esc(plainTitle(n.title))}</button>`
  ).join('');
  bar.scrollLeft = bar.scrollWidth;
}

// Slide (at the current zoom) so the node is centred horizontally, a quarter of the way down.
function panTo(id) {
  const p = lastLayout && lastLayout.pos.get(id);
  if (!p) return;
  view.x = wrapper.clientWidth / 2 - p.x * view.scale;
  view.y = wrapper.clientHeight / 4 - p.y * view.scale;
  stage.style.transition = 'transform 250ms ease';
  applyView();
  setTimeout(() => { stage.style.transition = ''; }, 260);
}

$('pathBar').addEventListener('click', e => {
  const crumb = e.target.closest('.crumb');
  if (crumb) { selectNode(crumb.dataset.id); panTo(crumb.dataset.id); }
});

// ---------- Gestures: pan from anywhere, pinch/wheel zoom, taps ----------
// Taps are handled on pointerup (not click) so a drag that starts on a node still pans.

const TAP_SLOP = 8;
const pointers = new Map();
let gesture = null, drag = null, pinch = null;

function startDrag() {
  const [p] = pointers.values();
  drag = { x: p.x, y: p.y, vx: view.x, vy: view.y };
  pinch = null;
}

function startPinch() {
  const [a, b] = pointers.values();
  const r = wrapper.getBoundingClientRect();
  const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, scale: view.scale,
            mapX: (mx - view.x) / view.scale, mapY: (my - view.y) / view.scale };
  drag = null;
}

wrapper.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  try { wrapper.setPointerCapture(e.pointerId); } catch { /* synthetic or already gone */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  $('hint').hidden = true;
  if (pointers.size === 1) {
    gesture = { id: e.pointerId, target: e.target, x0: e.clientX, y0: e.clientY, moved: false, multi: false };
    startDrag();
    wrapper.classList.add('dragging');
  } else {
    if (gesture) gesture.multi = true;
    startPinch();
  }
});

wrapper.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture && e.pointerId === gesture.id && Math.hypot(e.clientX - gesture.x0, e.clientY - gesture.y0) > TAP_SLOP) gesture.moved = true;
  if (drag) {
    view.x = drag.vx + e.clientX - drag.x;
    view.y = drag.vy + e.clientY - drag.y;
    applyView();
  } else if (pinch) {
    const [a, b] = pointers.values();
    const r = wrapper.getBoundingClientRect();
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    view.scale = clampScale(pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d);
    view.x = mx - pinch.mapX * view.scale;
    view.y = my - pinch.mapY * view.scale;
    applyView();
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  try { wrapper.releasePointerCapture(e.pointerId); } catch { /* not captured */ }
  if (pointers.size === 0) {
    const g = gesture;
    gesture = drag = pinch = null;
    wrapper.classList.remove('dragging');
    if (g && e.type === 'pointerup' && !g.multi && !g.moved) handleTap(g.target);
  } else if (pointers.size === 1) startDrag();
  else startPinch();
}
wrapper.addEventListener('pointerup', endPointer);
wrapper.addEventListener('pointercancel', endPointer);

function handleTap(target) {
  const link = target.closest('a[href]');
  if (link) {
    if (/^(https?|mailto):$/i.test(link.protocol)) window.open(link.href, '_blank', 'noopener');
    return;
  }
  const node = target.closest('.node');
  if (!node) return;
  if (target.closest('.toggle')) {
    const id = node.dataset.id;
    if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
    renderMap(id);
  } else selectNode(node.dataset.id);
}

// the tap handler opens links itself; stop the native click from also navigating this page
wrapper.addEventListener('click', e => { if (e.target.closest('a')) e.preventDefault(); });
wrapper.addEventListener('dblclick', e => e.preventDefault());
wrapper.addEventListener('gesturestart', e => e.preventDefault());   // iOS page zoom over the map only

wrapper.addEventListener('wheel', e => {
  e.preventDefault();
  if (!e.deltaY) return;   // sideways swipe
  const r = wrapper.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const s = clampScale(view.scale * Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015)));
  view.x = mx - (mx - view.x) * s / view.scale;
  view.y = my - (my - view.y) * s / view.scale;
  view.scale = s;
  applyView();
}, { passive: false });

// Shrink display math that is wider than its card instead of letting it spill or scroll.
function fitMath() {
  mindMap.querySelectorAll('.katex-display').forEach(el => {
    el.style.fontSize = '';
    if (el.scrollWidth > el.clientWidth + 1) el.style.fontSize = (el.clientWidth / el.scrollWidth).toFixed(3) + 'em';
  });
}

function scheduleLayout() {
  if (layoutQueued) return;
  layoutQueued = true;
  requestAnimationFrame(() => { layoutQueued = false; layoutNow(); });
}

function layoutNow() {
  if (!mapRoot) return;
  const sizes = new Map();
  mindMap.querySelectorAll('.node').forEach(e => sizes.set(e.dataset.id, { w: e.offsetWidth, h: e.offsetHeight, el: e }));
  const L = layoutTree(mapRoot, visibleKids, n => sizes.get(n.id));
  for (const [id, p] of L.pos) {
    const s = sizes.get(id);
    s.el.style.left = (p.x - s.w / 2) + 'px';
    s.el.style.top = p.y + 'px';
  }
  mindMap.style.width = stage.style.width = L.width + 'px';
  mindMap.style.height = stage.style.height = L.height + 'px';
  drawConnections(L, sizes);
  lastLayout = L;
}

// Straight down out of the parent's level, curve in the gap between levels, straight down into the child.
// The layout keeps lanes free for both straight parts.
function drawConnections(L, sizes) {
  svg.setAttribute('width', L.width);
  svg.setAttribute('height', L.height);
  const paths = [];
  for (const [id, c] of L.pos) {
    const n = nodesById.get(id);
    if (!n.parentId) continue;
    const p = L.pos.get(n.parentId);
    const yA = L.levels[n.depth - 1].bottom, yB = L.levels[n.depth].top, ym = (yA + yB) / 2;
    paths.push(`<path class="${n.color}" d="M ${p.x} ${p.y + sizes.get(n.parentId).h} L ${p.x} ${yA} ` +
      `C ${p.x} ${ym}, ${c.x} ${ym}, ${c.x} ${yB} L ${c.x} ${c.y}"/>`);
  }
  svg.innerHTML = paths.join('');
}

function applyView() {
  stage.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
}

const clampScale = s => Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));

// Root at reading size, centred at the top: readable straight away instead of a tiny whole-tree view.
function resetView() {
  const root = lastLayout && lastLayout.pos.get(mapRoot.id);
  view = { scale: 1, x: wrapper.clientWidth / 2 - (root ? root.x : 0), y: 24 };
  applyView();
}

function fitToView() {
  const pad = 24, w = mindMap.offsetWidth, h = mindMap.offsetHeight;
  const s = clampScale(Math.min((wrapper.clientWidth - 2 * pad) / w, (wrapper.clientHeight - 2 * pad) / h, 1));
  view = { scale: s, x: (wrapper.clientWidth - w * s) / 2, y: pad };
  applyView();
}

function expandAll() {
  collapsed.clear();
  renderMap();
}

function collapseAll() {
  collapsed = new Set([...nodesById.values()].filter(n => n.parentId && n.children.length).map(n => n.id));
  renderMap();
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  store.set('mindmap-theme', t);
}

// ---------- Open, remember, save as single file ----------

let currentSource = null;

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { t.hidden = true; }, 4000);
}

function loadMap(text, name, remember = true) {
  const root = parseMap(text, name);
  if (!root) {
    showToast(`No headings found in ${name} — map not changed.`);
    return false;
  }
  currentSource = { text, name };
  setMap(root);
  if (remember) store.set('mindmap-last', JSON.stringify({ name, text }));
  return true;
}

// This viewer with the map baked into its Markdown block: one file that opens anywhere, no storage needed.
function exportHTML(text, name) {
  const doc = new DOMParser().parseFromString(PRISTINE_HTML, 'text/html');
  const block = doc.getElementById('map-source');
  block.textContent = '\n' + text.replace(/<(\\*)(\/script|!--)/gi, '<\\$1$2') + '\n';
  block.dataset.source = 'export';
  block.dataset.name = name;
  return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
}

function saveSingleFile() {
  const { text, name } = currentSource;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([exportHTML(text, name)], { type: 'text/html' }));
  a.download = name.replace(/\.[^.]*$/, '') + '.html';
  document.body.appendChild(a);
  a.click();
  a.remove();   // the blob URL is never revoked: iOS fetches it only after the user confirms the download
}

// No accept= filter: iOS can grey out .md files when one is set.
$('openBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';   // so the same file can be opened again
  if (file) loadMap(await file.text(), file.name);
});
$('saveBtn').addEventListener('click', saveSingleFile);

// ---------- Toolbar ----------

$('expandBtn').addEventListener('click', expandAll);
$('collapseBtn').addEventListener('click', collapseAll);
$('fitBtn').addEventListener('click', fitToView);
$('resetBtn').addEventListener('click', resetView);
$('themeBtn').addEventListener('click', () =>
  setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));
$('depthInput').addEventListener('input', e => {
  const v = e.target.value.trim();
  maxDepth = v === '' ? Infinity : Math.max(0, Math.floor(Number(v) || 0));
  renderMap();
});

// ---------- Startup ----------

document.documentElement.dataset.theme = store.get('mindmap-theme') === 'light' ? 'light' : 'dark';
{
  // an exported single file shows its own map; otherwise the last opened map; otherwise the sample
  const embedded = readEmbeddedMap();
  let src = embedded;
  if (!embedded.exported) {
    try {
      const last = JSON.parse(store.get('mindmap-last'));
      if (last && typeof last.text === 'string') src = last;
    } catch { /* nothing usable remembered */ }
  }
  if (!loadMap(src.text, src.name || 'map.md', false)) loadMap(embedded.text, embedded.name, false);
}
if (document.fonts) document.fonts.ready.then(() => { fitMath(); scheduleLayout(); });

window.mindmapReady = true;
</script>
</body>
</html>
