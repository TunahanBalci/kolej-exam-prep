<script type="text/markdown" id="map-source" data-source="sample" data-name="sample.md">
# How to write a mind map
Each **heading** in the Markdown file becomes a node. Everything under a heading is that node's note.

## Headings make nodes
The number of `#` signs sets the depth: `#` is the centre, `##` a main branch, `###` a sub-topic, and so on.

### Sub-topic (###)
A child of the branch above it.

#### Detail (####)
Go as deep as you need.

##### Fine detail (#####)
There is no depth limit.

## Lists
### Unordered list
Use `-` when order does not matter:
- File manipulation
- Status information
- Programming-language support

### Ordered list
Use `1.` when the sequence matters:
1. The program puts the system-call number in a register
2. The system-call interface indexes a table
3. The kernel routine runs and returns a status

## Math
### Inline math
Write math between single dollars: the time slice $q$, or the average waiting time $\bar W = \frac{1}{n}\sum_i W_i$.

### Display math
Use double dollars for an equation on its own line:
$$T_{turnaround} = T_{finish} - T_{arrival}$$

## Code
Put code in a fenced block with the language name after the opening fence. End with a **Result:** line when the output matters.

### C example
```c
#include <stdio.h>

int main(void) {
    printf("%d\n", 6 * 7);
    return 0;
}
```
**Result:** prints `42`

### Python example
```python
def square(x):
    return x * x

print(square(5))
```
**Result:** `25`

### Scheme example
```scheme
(define (fact n)
  (if (= n 0) 1 (* n (fact (- n 1)))))
(fact 5)
```
**Result:** `120`

### Haskell example
```haskell
sumList :: [Int] -> Int
sumList = foldr (+) 0

main = print (sumList [1, 2, 3])
```
**Result:** `6`

<script>
const PRISTINE_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

// ---------- Markdown map -> tree ----------

function parseMap(text, fileName) {
  const lines = String(text).replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
  const heads = [];
  let cur = null, fence = null;
  for (const line of lines) {
    const f = line.match(/^\s*(```|~~~)/);
    if (f) fence = !fence ? f[1] : (f[1] === fence ? null : fence);
    const h = !fence && !f && line.match(/^(#+)\s+(.*?)(?:\s+#+)?\s*$/);
    if (h) heads.push(cur = { level: h[1].length, title: h[2], body: [] });
    else if (cur) cur.body.push(line);
  }
  if (!heads.length) return null;

  const nodes = heads.map((h, i) => ({
    id: 'n' + i, title: h.title, body: h.body.join('\n'), level: h.level,
    depth: 0, color: '', parentId: null, children: []
  }));
  const stack = [], tops = [];
  for (const n of nodes) {
    while (stack.length && stack.at(-1).level >= n.level) stack.pop();
    const parent = stack.at(-1);
    if (parent) { n.parentId = parent.id; parent.children.push(n); } else tops.push(n);
    stack.push(n);
  }

  let root = tops[0];
  if (tops.length !== 1 || root.level !== 1) {
    const title = String(fileName || '').replace(/\.[^.]*$/, '') || 'Mind Map';
    root = { id: 'root', title, body: '', level: 0, depth: 0, color: '', parentId: null, children: tops };
    tops.forEach(t => { t.parentId = 'root'; });
  }
  (function walk(n, depth, color) {
    n.depth = depth;
    n.color = color;
    n.children.forEach((c, i) => walk(c, depth + 1, depth === 0 ? `branch-${i % 5 + 1}` : color));
  })(root, 0, 'root');
  return root;
}

function flatten(root) {
  return [root, ...root.children.flatMap(flatten)];
}

function readEmbeddedMap() {
  const el = document.getElementById('map-source');
  return {
    text: el.textContent.replaceAll('<\\/script', '</script'),
    name: el.dataset.name || 'map.md',
    exported: el.dataset.source === 'export'
  };
}

// ---------- Markdown, math and code rendering ----------

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c]);
}

// Group 1 passes code (and escaped \$) through untouched; the rest is math.
// Inline $…$ follows Pandoc's rule so prose like "$5 and $10" stays text.
const MATH_RE = /(```[\s\S]*?```|~~~[\s\S]*?~~~|`[^`\n]*`|\\\$)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=[^\s$`])([^$`\n]*?[^\s`])\$(?!\d)/g;

function protectMath(md) {
  const math = [];
  const text = md.replace(MATH_RE, (m, code, d1, d2, i1, i2) => {
    if (code) return m;
    math.push({ tex: d1 ?? d2 ?? i1 ?? i2, display: d1 != null || d2 != null });
    return `MATHTOKEN${math.length - 1}X`;
  });
  return { text, restore: html => html.replace(/MATHTOKEN(\d+)X/g, (_, i) => renderTex(math[i])) };
}

function renderTex({ tex, display }) {
  if (!window.katex) return esc(display ? `$$${tex}$$` : `$${tex}$`);
  return katex.renderToString(tex, { displayMode: display, throwOnError: false });
}

if (window.marked) {
  marked.use({
    renderer: {
      html: ({ text }) => esc(text),   // raw HTML in a map is shown, never run
      code({ text, lang }) {
        const l = String(lang || '').trim().split(/\s+/)[0].toLowerCase() || 'text';
        const body = window.hljs && hljs.getLanguage(l) ? hljs.highlight(text, { language: l }).value : esc(text);
        return `<div class="code-card"><div class="code-top"><span class="dot"></span><span class="dot"></span>` +
          `<span class="dot"></span><span class="code-lang">${esc(l)}</span></div>` +
          `<pre><code class="hljs language-${esc(l)}">${body}</code></pre></div>`;
      }
    }
  });
}

function renderMarkdown(md) {
  const src = String(md ?? '').trim();
  if (!src) return '';
  if (!window.marked) return '<p>' + esc(src).replace(/\n/g, '<br>') + '</p>';
  const { text, restore } = protectMath(src);
  return restore(marked.parse(text));
}

function renderInline(md) {
  if (!window.marked) return esc(md);
  const { text, restore } = protectMath(String(md ?? ''));
  return restore(marked.parseInline(text));
}

function plainTitle(md) {
  return String(md ?? '').replace(/\\[()[\]]/g, '').replace(/[`*_$]/g, '').trim();
}

// ---------- Zig-zag layout ----------
// Siblings alternate between a high row (0) and a low row (1). Every (depth, row) pair is a
// horizontal band; bands never overlap vertically, so packing is 1-D per band. Lanes keep room
// for the vertical part of each connector: a low-row node's incoming line crosses its depth's
// high band, and a high-row parent's outgoing line crosses its depth's low band.

const H_GAP = 28, LANE = 16, ROW_GAP = 22, LEVEL_GAP = 64, MARGIN = 40;

function layoutTree(root, kids, size) {
  const info = new Map();

  function pack(node, depth, row) {
    const { w, h } = size(node);
    const me = { w, h, depth, row, rel: 0, children: [] };
    info.set(node.id, me);
    const merged = new Map();   // band -> rightmost edge among children placed so far
    const placed = [];
    kids(node).forEach((child, i) => {
      const contour = pack(child, depth + 1, i % 2);
      let off = placed.length ? placed.at(-1).off : 0;
      if (placed.length) {
        for (const [band, [lo]] of contour) {
          if (merged.has(band)) off = Math.max(off, merged.get(band) + H_GAP - lo);
        }
      }
      for (const [band, [, hi]] of contour) merged.set(band, Math.max(merged.get(band) ?? -Infinity, hi + off));
      placed.push({ child, off, contour });
    });

    const centre = placed.length ? (placed[0].off + placed.at(-1).off) / 2 : 0;
    const contour = new Map();
    const add = (band, lo, hi) => {
      const c = contour.get(band);
      contour.set(band, c ? [Math.min(c[0], lo), Math.max(c[1], hi)] : [lo, hi]);
    };
    add(`${depth}:${row}`, -w / 2, w / 2);
    if (row === 1) add(`${depth}:0`, -LANE / 2, LANE / 2);
    if (row === 0 && placed.length) add(`${depth}:1`, -LANE / 2, LANE / 2);
    for (const p of placed) {
      info.get(p.child.id).rel = p.off - centre;
      me.children.push(p.child.id);
      for (const [band, [lo, hi]] of p.contour) add(band, lo + p.off - centre, hi + p.off - centre);
    }
    return contour;
  }
  pack(root, 0, 0);

  // absolute x (centres), then the vertical bands
  const absX = new Map();
  (function place(id, x) {
    absX.set(id, x);
    info.get(id).children.forEach(c => place(c, x + info.get(c).rel));
  })(root.id, 0);

  const bands = [];
  for (const m of info.values()) {
    const b = bands[m.depth] ??= { hh: 0, hl: 0 };
    if (m.row) b.hl = Math.max(b.hl, m.h); else b.hh = Math.max(b.hh, m.h);
  }
  let y = MARGIN;
  for (const b of bands) {
    b.top = y;
    b.lowTop = y + b.hh + ROW_GAP;
    b.bottom = b.hl ? b.lowTop + b.hl : y + b.hh;
    y = b.bottom + LEVEL_GAP;
  }

  let minL = Infinity, maxR = -Infinity;
  for (const [id, m] of info) {
    minL = Math.min(minL, absX.get(id) - m.w / 2);
    maxR = Math.max(maxR, absX.get(id) + m.w / 2);
  }
  const pos = new Map();
  for (const [id, m] of info) {
    const b = bands[m.depth];
    pos.set(id, { x: absX.get(id) - minL + MARGIN, y: m.row ? b.lowTop : b.top, row: m.row });
  }
  return {
    pos,
    levels: bands.map(b => ({ top: b.top, bottom: b.bottom })),
    width: maxR - minL + 2 * MARGIN,
    height: bands.at(-1).bottom + MARGIN
  };
}

window.mindmapReady = true;
</script>
